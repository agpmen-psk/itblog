{% extends "app/layout.html" %}

{% block content %}
<h2>Добавить новость</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<p style="margin-top: 20px;">
    <a href="{% url 'blog' %}">Вернуться к списку новостей</a>
</p>
{% endblock %}
